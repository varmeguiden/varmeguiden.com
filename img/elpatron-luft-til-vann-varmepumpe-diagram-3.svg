<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Logg en periode med høyt tilskudd</title><desc>Sammenhold datapunkter fra samme tidsrom. Vær: Noter utetemperatur og tidspunkt.. Varmebehov: Noter romvarme eller tankoppvarming hvis vist.. Styring: Noter alarm, kompressorstatus og aktivt trinn..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Logg en periode med høyt tilskudd</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Vær</text><text x="43" y="99" font-size="15">Noter utetemperatur og tidspunkt.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4 7l16 10M4 17 20 7m-8-4-2 2m2-2 2 2m-2 16-2-2m2 2 2-2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Varmebehov</text><text x="43" y="165" font-size="15">Noter romvarme eller tankoppvarming hvis vist.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 5 6 6 6 12a6 6 0 1 1-12 0c0-2 1-4 3-6 0 3 2 4 3 4 1-3 1-6 0-10Z"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Styring</text><text x="43" y="231" font-size="15">Noter alarm, kompressorstatus og aktivt trinn.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm4 4h5v5H7V9Zm8 1h3m-3 4h3"/></g></g></svg>