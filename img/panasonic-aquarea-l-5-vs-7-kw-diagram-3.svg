<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>To pakker med ulik plassbruk</title><desc>Kontroller den konkrete innedelens kode. All in One: Katalogeksemplet har integrert 185-liters tank.. Bi-bloc: Avklar tank separat i tilbudet.. Begge: Spør om eltilskudd, rørføring og serviceplass..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">To pakker med ulik plassbruk</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">All in One</text><text x="43" y="99" font-size="15">Katalogeksemplet har integrert 185-liters tank.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5c0-3 10-3 10 0v14c0 3-10 3-10 0V5Zm0 0c0 3 10 3 10 0m-7 16v2m4-2v2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Bi-bloc</text><text x="43" y="165" font-size="15">Avklar tank separat i tilbudet.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10a5 5 0 0 1 5 5v8m4 0v-8a9 9 0 0 0-9-9H3m0 0v4m15 13h4"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Begge</text><text x="43" y="231" font-size="15">Spør om eltilskudd, rørføring og serviceplass.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8-8a5 5 0 0 1 6-7l-3 3 2 2 3-3a5 5 0 0 1-7 6l-8 8-1-1Z"/></g></g></svg>