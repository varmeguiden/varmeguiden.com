<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>Sjekk hva som ligger i målingen</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">Sjekk hva som ligger i målingen</text><rect x="18" y="52" width="524" height="69" rx="9" fill="#dcece0"/><circle cx="43" cy="73" r="12" fill="#24674b"/><text x="39" y="78" font-size="14" fill="#fff">1</text><text x="63" y="78" font-weight="700">Kompressor</text><text x="63" y="103" font-size="16">Eksempel: 52 kWh på egen kurs.</text><rect x="18" y="130" width="524" height="69" rx="9" fill="#fff"/><circle cx="43" cy="151" r="12" fill="#24674b"/><text x="39" y="156" font-size="14" fill="#fff">2</text><text x="63" y="156" font-weight="700">Reserve</text><text x="63" y="181" font-size="16">Eksempel: 13 kWh på separat kurs.</text><rect x="18" y="208" width="524" height="69" rx="9" fill="#fae9d3"/><circle cx="43" cy="229" r="12" fill="#24674b"/><text x="39" y="234" font-size="14" fill="#fff">3</text><text x="63" y="234" font-weight="700">Samme periode</text><text x="63" y="259" font-size="16">65 kWh totalt, telt én gang per kurs.</text></g></svg>