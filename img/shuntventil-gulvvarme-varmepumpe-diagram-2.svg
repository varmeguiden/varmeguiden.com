<svg xmlns="http://www.w3.org/2000/svg" width="560" height="325" viewBox="0 0 560 325"><title>Tre systemer, tre vannveier</title><desc>Prinsippskisser. Virkelig kobling må prosjekteres for huset. Direkte til gulv, radiatorgren med separat blanding til gulv, og to samordnede varmekilder. Retur og øvrige komponenter er utelatt.</desc><rect width="560" height="325" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre systemer, tre vannveier</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0l10 5-10 5Z" fill="#274f43"/></marker></defs><text x="24" y="64" font-size="15" font-weight="700">Én lavtemperaturkrets</text><rect x="24" y="75" width="108" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="33" y="95" font-size="13" font-weight="700">Varmepumpe</text><path d="M132 91H304" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="304" y="75" width="118" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="313" y="95" font-size="13" font-weight="700">Gulvfordeler</text><text x="24" y="134" font-size="15" font-weight="700">Radiatorer og blandet gulvkrets</text><rect x="24" y="145" width="108" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="33" y="165" font-size="13" font-weight="700">Varmepumpe</text><path d="M132 161H180" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="180" y="145" width="107" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="189" y="165" font-size="13" font-weight="700">Radiatorgren</text><path d="M154 161V205H211" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="211" y="189" width="84" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="220" y="209" font-size="13" font-weight="700">Shunt</text><path d="M295 205H400" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="400" y="189" width="130" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="409" y="209" font-size="13" font-weight="700">Gulvfordeler</text><text x="24" y="253" font-size="15" font-weight="700">To varmekilder med plan for temperatur</text><rect x="24" y="264" width="108" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="33" y="284" font-size="13" font-weight="700">Pumpe + kjel</text><path d="M132 280H211" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="211" y="264" width="124" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="220" y="284" font-size="13" font-weight="700">Samordnet drift</text><path d="M335 280H400" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="400" y="264" width="130" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="409" y="284" font-size="13" font-weight="700">Gulvkrets</text></g></svg>