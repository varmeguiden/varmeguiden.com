<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tre typer nettbrudd</title><desc>Planlegg etter stedet bruddet skjer. Internett: Lokal styring kan avhenge av adapteren.. Skytjeneste: Skyintegrasjoner trenger tjenesten.. Home Assistant: Bruk kjent lokal betjening og varmeplan..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre typer nettbrudd</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Internett</text><text x="43" y="99" font-size="15">Lokal styring kan avhenge av adapteren.</text><g transform="translate(501,72)" fill="none" stroke="#176346" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10M4 5h10m6 8v7H4V5"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Skytjeneste</text><text x="43" y="165" font-size="15">Skyintegrasjoner trenger tjenesten.</text><g transform="translate(501,138)" fill="none" stroke="#a75b24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V6a3 3 0 1 1 6 0v8a5 5 0 1 1-6 0Zm3 4v-7"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Home Assistant</text><text x="43" y="231" font-size="15">Bruk kjent lokal betjening og varmeplan.</text><g transform="translate(501,204)" fill="none" stroke="#285477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4V4Zm13 0v4h3M7 11h10m-10 4h9"/></g></g></svg>