<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Samme areal med to røravstander</title><desc>Idealiserte rette felt på 18 m². Tilførsel og retur kommer i tillegg. 200 mm senteravstand: omtrent 90 m. 150 mm senteravstand: omtrent 120 m.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Samme areal med to røravstander</text><text x="25" y="82">200 mm senteravstand</text><rect x="25" y="94" width="337.5" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">omtrent 90 m</text><text x="25" y="178">150 mm senteravstand</text><rect x="25" y="190" width="450.0" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">omtrent 120 m</text></g></svg>