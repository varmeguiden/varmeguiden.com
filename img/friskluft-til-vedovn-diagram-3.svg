<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tre svar før aktørene bestiller</title><desc>Samle ovn, ventilasjon og pipe i én avklaring. Ildsted: Hvilken modell og tilkobling er valgt?. Luftvei: Hvor går kanalen, og hvem står for arbeidet?. Kontroll: Hvem avklarer samspill med vanlig avtrekk?.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre svar før aktørene bestiller</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Ildsted</text><text x="43" y="99" font-size="15">Hvilken modell og tilkobling er valgt?</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 5 6 6 6 12a6 6 0 1 1-12 0c0-2 1-4 3-6 0 3 2 4 3 4 1-3 1-6 0-10Z"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Luftvei</text><text x="43" y="165" font-size="15">Hvor går kanalen, og hvem står for arbeidet?</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10a5 5 0 0 1 5 5v8m4 0v-8a9 9 0 0 0-9-9H3m0 0v4m15 13h4"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Kontroll</text><text x="43" y="231" font-size="15">Hvem avklarer samspill med vanlig avtrekk?</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8-8a5 5 0 0 1 6-7l-3 3 2 2 3-3a5 5 0 0 1-7 6l-8 8-1-1Z"/></g></g></