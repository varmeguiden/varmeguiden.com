<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Mål tre steder før du velger</title><desc>Vurder høyde for hele den dokumenterte oppbygningen. Dørblad: Kontroller klaring med døra i bevegelse.. Terskel og overgang: Ta med høyden mot rommet ved siden av.. Fast innredning: Avklar oppbygning ved sokler og tilkoblinger..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Mål tre steder før du velger</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Dørblad</text><text x="43" y="99" font-size="15">Kontroller klaring med døra i bevegelse.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16m-13 0V3h10v18m-3-9v2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Terskel og overgang</text><text x="43" y="165" font-size="15">Ta med høyden mot rommet ved siden av.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h7v-6h6V8h5M3 5h7m-3-3 3 3-3 3"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Fast innredning</text><text x="43" y="231" font-size="15">Avklar oppbygning ved sokler og tilkoblinger.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v13H3V6Zm9 0v13M7 11v3m10-3v3m-12 5v2m14-2v2"/></g></g></svg>