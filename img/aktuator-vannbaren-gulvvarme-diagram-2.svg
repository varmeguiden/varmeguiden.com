<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Én kald sone eller flere?</title><desc>Start med mønsteret før du ser etter en reservedel. Én kald sløyfe: Noter rom, varmekall og synlig vannmengde.. Flere soner samtidig: Sjekk om de deler styring eller varmeforsyning.. Varmt rør, kaldt gulv: Følg utviklingen over tid med samme innstilling..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Én kald sone eller flere?</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Én kald sløyfe</text><text x="43" y="99" font-size="15">Noter rom, varmekall og synlig vannmengde.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9 3-9 3V9Zm18 0-9 3 9 3V9Zm-9-3v6m-4-6h8"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Flere soner samtidig</text><text x="43" y="165" font-size="15">Sjekk om de deler styring eller varmeforsyning.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v16H3V4Zm9 0v16M3 12h9m0 4h9"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Varmt rør, kaldt gulv</text><text x="43" y="231" font-size="15">Følg utviklingen over tid med samme innstilling.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 