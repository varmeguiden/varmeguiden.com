<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Finn pumpa som betjener gulvet</title><desc>Følg dokumentasjonen. Flere pumper kan ligne. Varmekilden: En pumpe kan høre til varmekilden.. Fordeleren: En annen kan sirkulere vann til sløyfene.. Identifiser enheten: Ta med kode, krets og rom som er berørt..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Finn pumpa som betjener gulvet</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Varmekilden</text><text x="43" y="99" font-size="15">En pumpe kan høre til varmekilden.</text><g transform="translate(501,72)" fill="none" stroke="#176346" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4V4Zm13 0v4h3M7 11h10m-10 4h9"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Fordeleren</text><text x="43" y="165" font-size="15">En annen kan sirkulere vann til sløyfene.</text><g transform="translate(501,138)" fill="none" stroke="#a75b24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18m-7-6 7 6-7 6M3 6v12"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Identifiser enheten</text><text x="43" y="231" font-size="15">Ta med kode, krets og rom som er berørt.</text><g transform="translate(501,204)" fill="none" stroke="#285477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l4 2"/></g></g></svg>