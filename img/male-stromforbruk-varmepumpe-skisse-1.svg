<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>Hvilken energi ser du?</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">Hvilken energi ser du?</text><rect x="18" y="52" width="524" height="69" rx="9" fill="#dcece0"/><circle cx="43" cy="73" r="12" fill="#24674b"/><text x="39" y="78" font-size="14" fill="#fff">1</text><text x="63" y="78" font-weight="700">App</text><text x="63" y="103" font-size="16">Avklar om kWh er målt eller beregnet.</text><rect x="18" y="130" width="524" height="69" rx="9" fill="#fff"/><circle cx="43" cy="151" r="12" fill="#24674b"/><text x="39" y="156" font-size="14" fill="#fff">2</text><text x="63" y="156" font-weight="700">Kursmåler</text><text x="63" y="181" font-size="16">Registrerer lastene som er koblet til kursen.</text><rect x="18" y="208" width="524" height="69" rx="9" fill="#fae9d3"/><circle cx="43" cy="229" r="12" fill="#24674b"/><text x="39" y="234" font-size="14" fill="#fff">3</text><text x="63" y="234" font-weight="700">AMS-måler</text><text x="63" y="259" font-size="16">Registrerer det samlede kjøpet fra strømnettet.</text></g></svg>