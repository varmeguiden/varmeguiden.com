<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Mindre varme ned endrer kjelleren</title><desc>Forhold som må gjennomgås samlet på befaring. Temperatur: Rom og overflater nede kan bli kaldere.. Fukt: Avklar kilder og forventede forhold etter tiltaket.. Rør: Sjekk om utsatte strekninger trenger vurdering..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Mindre varme ned endrer kjelleren</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Temperatur</text><text x="43" y="99" font-size="15">Rom og overflater nede kan bli kaldere.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V6a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0Zm2 3v-8m5-2h3m-3 4h2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Fukt</text><text x="43" y="165" font-size="15">Avklar kilder og forventede forhold etter tiltaket.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 4 6 8 6 12a6 6 0 0 1-12 0c0-4 4-8 6-12Z"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Rør</text><text x="43" y="231" font-size="15">Sjekk om utsatte strekninger trenger vurdering.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10a5 5 0 0 1 5 5v8m4 0v-8a9 9 0 0 0-9-9H3m0 0v4m15 13h4"/></g></g></svg>