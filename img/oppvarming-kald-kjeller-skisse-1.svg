<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>Hvor merker du kulda?</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">Hvor merker du kulda?</text><path d="M200 95h325v157H200Z" fill="#fff" stroke="#3d624b" stroke-width="4"/><path d="M26 137h170v115H26Z" fill="#dbc5a5"/><path d="M200 252H527" stroke="#789188" stroke-width="11"/><path d="M200 95v157" stroke="#789188" stroke-width="9"/><rect x="226" y="97" width="104" height="17" fill="#8fbecc"/><text x="35" y="185">Terreng</text><text x="223" y="146">Vegg mot bakken</text><text x="240" y="229">Gulv</text><text x="384" y="194">Oppholdssone</text><text x="25" y="281">Noter hvor du måler og hvor det kjennes kaldt.</text></g></svg>