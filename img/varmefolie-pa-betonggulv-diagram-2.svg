<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Samme temperaturforskjell</title><desc>Eksempel med 10 graders forskjell og to antatte motstander. Motstand 0,50 m²K/W: 20 W/m². Motstand 1,00 m²K/W: 10 W/m².</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Samme temperaturforskjell</text><text x="25" y="82">Motstand 0,50 m²K/W</text><rect x="25" y="94" width="450.0" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">20 W/m²</text><text x="25" y="178">Motstand 1,00 m²K/W</text><rect x="25" y="190" width="225.0" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">10 W/m²</text></g></svg>