<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tre ulike temperatursaker</title><desc>Mønsteret sier hva som er verdt å sjekke. Fast tall på displayet: Avklar om det er settpunktet.. Forskjell mellom steder: Undersøk trekk, høyde og luftfordeling.. Plutselig avvik i samme punkt: Noter drift og ta med modellkode til service..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre ulike temperatursaker</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Fast tall på displayet</text><text x="43" y="99" font-size="15">Avklar om det er settpunktet.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1 4h6v4H9Zm0 8h6m-3 3v2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Forskjell mellom steder</text><text x="43" y="165" font-size="15">Undersøk trekk, høyde og luftfordeling.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13c5 0 5-5 1-5M3 12h16c5 0 5 6 1 6m-17-1h10c4 0 4 5 0 5"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Plutselig avvik i samme punkt</text><text x="43" y="231" font-size="15">Noter drift og ta med modellkode til service.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8-8a5 5 0 0 1 6-7l-3 3 2 2 3-3a5 5 0 0 1-7 6l-8 8-1-1Z"/></g></g></svg>