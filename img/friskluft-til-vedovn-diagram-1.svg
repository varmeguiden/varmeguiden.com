<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Luftveier fram til ildstedet</title><desc>Skisser begge alternativer med installatøren. Fra rommet: Lufta når ovnen via rommet og husets luftveier.. Direkte uteluft: Egen kanal føres til ovnens godkjente tilkobling.. Røykgass: Skorsteinen må passe til ildstedet og driften..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Luftveier fram til ildstedet</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Fra rommet</text><text x="43" y="99" font-size="15">Lufta når ovnen via rommet og husets luftveier.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 5 6 6 6 12a6 6 0 1 1-12 0c0-2 1-4 3-6 0 3 2 4 3 4 1-3 1-6 0-10Z"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Direkte uteluft</text><text x="43" y="165" font-size="15">Egen kanal føres til ovnens godkjente tilkobling.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13c5 0 5-5 1-5M3 12h16c5 0 5 6 1 6m-17-1h10c4 0 4 5 0 5"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Røykgass</text><text x="43" y="231" font-size="15">Skorsteinen må passe til ildstedet og driften.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18m-16 0V9h14v10m-7-10V3h5v6m-8 6h6"/></g></g></svg>