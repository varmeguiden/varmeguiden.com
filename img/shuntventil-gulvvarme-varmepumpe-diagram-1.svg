<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Fra kildetur til gulvtur</title><desc>Skjematisk blanding. Tallene er et regneeksempel. Varm tur og kjøligere gulvretur gir 37,5 °C i eksemplet med 45 °C, 30 °C og like mengder.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Fra kildetur til gulvtur</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0l10 5-10 5Z" fill="#274f43"/></marker></defs><rect x="24" y="79" width="133" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="33" y="99" font-size="13" font-weight="700">Kildetur 45 °C</text><rect x="24" y="159" width="133" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="33" y="179" font-size="13" font-weight="700">Gulvretur 30 °C</text><path d="M157 95H207L251 132" fill="none" stroke="#a75b24" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M157 175H207L251 138" fill="none" stroke="#285477" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="273" cy="135" r="20" fill="#fff" stroke="#176346" stroke-width="2"/><text x="260" y="141" font-size="14" font-weight="700">1:1</text><path d="M293 135H373" fill="none" stroke="#176346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="373" y="119" width="159" height="32" rx="6" fill="white" stroke="#9cb2a3"/><text x="382" y="139" font-size="13" font-weight="700">Gulvtur 37,5 °C</text><text x="24" y="235" font-size="15">Like store vannmengder i regneeksemplet.</text></g></svg>