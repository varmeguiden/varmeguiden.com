<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tolk ordet «tilskudd» i styringen</title><desc>Ordet alene gir ingen sikker avlesning av energi. Tilgjengelig: Styringen kan hente støtte ved behov.. Aktivt: Se hva statusen betyr for valgt styringsenhet.. Målt: Kontroller hvilken last energitallet dekker..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tolk ordet «tilskudd» i styringen</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Tilgjengelig</text><text x="43" y="99" font-size="15">Styringen kan hente støtte ved behov.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm4 4h5v5H7V9Zm8 1h3m-3 4h3"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Aktivt</text><text x="43" y="165" font-size="15">Se hva statusen betyr for valgt styringsenhet.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 14h6l-1 8 9-12h-6l1-8Z"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Målt</text><text x="43" y="231" font-size="15">Kontroller hvilken last energitallet dekker.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm4 10a5 5 0 0 1 10 0m-5 0 3-3"/></g></g></svg>