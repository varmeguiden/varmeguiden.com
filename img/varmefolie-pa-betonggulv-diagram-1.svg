<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>To veier for varmen</title><desc>Prinsipp for varme over en kald betongplate. Opp mot rommet: Belegget og lagene over varmen leder varme opp.. Ned mot platen: Hvor mye som går ned avhenger av hele gulvet.. Langs ytterkanten: Kuldebroer kan gi forskjeller nær ytterveggen..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">To veier for varmen</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Opp mot rommet</text><text x="43" y="99" font-size="15">Belegget og lagene over varmen leder varme opp.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M12 16V4m-5 5 5-5 5 5"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Ned mot platen</text><text x="43" y="165" font-size="15">Hvor mye som går ned avhenger av hele gulvet.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16m-8 4v12m-5-5 5 5 5-5"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Langs ytterkanten</text><text x="43" y="231" font-size="15">Kuldebroer kan gi forskjeller nær ytterveggen.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v15h16m-12-7h9m-3-3 3 3-3 3"/></g></g></svg>