<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Samme effekt, ulik driftstid</title><desc>Regneeksempel med et 3 kW-trinn som går for fullt. 40 minutter: 2 kWh. 120 minutter: 6 kWh.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Samme effekt, ulik driftstid</text><text x="25" y="82">40 minutter</text><rect x="25" y="94" width="150.0" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">2 kWh</text><text x="25" y="178">120 minutter</text><rect x="25" y="190" width="450.0" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">6 kWh</text></g></svg>