<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tre deler av samme befaring</title><desc>Få rørveien og avløpsveiene inn i samme tegning. Innedel til gjennomføring: Avklar tilgang og vei for kondensvannet.. Gjennom ytterveggen: Avklar tetting og den planlagte åpningen.. Kanal til utedelen: Få samlet lengde og høydeforskjell bekreftet..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre deler av samme befaring</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Innedel til gjennomføring</text><text x="43" y="99" font-size="15">Avklar tilgang og vei for kondensvannet.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm6 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 0v8m-4-4h8m3-4h3m-3 4h3m-3 4h3"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Gjennom ytterveggen</text><text x="43" y="165" font-size="15">Avklar tetting og den planlagte åpningen.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm0 7h18m-12-7v7m6 0v7"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Kanal til utedelen</text><text x="43" y="231" font-size="15">Få samlet lengde og høydeforskjell bekreftet.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10a5 5 0 0 1 5 5v8m4 0v-8a9 9 0 0 0-9-9H3m0 0v4m15 13h4"/></g></g></svg>