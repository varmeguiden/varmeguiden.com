<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>To anvisninger må passe sammen</title><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">To anvisninger må passe sammen</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Belegg</text><text x="43" y="99" font-size="15">Sjekk varenummer, lag og temperaturgrense.</text><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Varmesystem</text><text x="43" y="165" font-size="15">Finn godkjent plassering og gulvoppbygning.</text><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Felles avklaring</text><text x="43" y="231" font-size="15">Få fastsatt én løsning for rommet.</text></g></svg>