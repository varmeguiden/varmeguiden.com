<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Ved tre typer avbrudd</title><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Ved tre typer avbrudd</text><rect x="24" y="53" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="53" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="75" font-weight="700">Nettbrudd</text><text x="43" y="97" font-size="15">Kontroller tidspunktet for siste registrering.</text><rect x="24" y="119" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="119" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="141" font-weight="700">Strømbrudd</text><text x="43" y="163" font-size="15">Sjekk hva hver enhet gjør når strømmen kommer.</text><rect x="24" y="185" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="185" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="207" font-weight="700">Signalproblem</text><text x="43" y="229" font-size="15">Kontroller siktlinje og hvordan pumpa reagerer.</text></g></svg>