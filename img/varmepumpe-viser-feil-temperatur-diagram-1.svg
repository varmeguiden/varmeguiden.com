<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Tre temperaturer i én stue</title><desc>Tallet avhenger av hva som faktisk vises. Settpunkt: Verdien du velger på fjernkontrollen.. Følerverdi: Temperaturen der den aktive føleren måler.. Kontrollmåling: Temperaturen der du bruker rommet..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Tre temperaturer i én stue</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Settpunkt</text><text x="43" y="99" font-size="15">Verdien du velger på fjernkontrollen.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1 4h6v4H9Zm0 8h6m-3 3v2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Følerverdi</text><text x="43" y="165" font-size="15">Temperaturen der den aktive føleren måler.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V6a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0Zm2 3v-8m5-2h3m-3 4h2"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Kontrollmåling</text><text x="43" y="231" font-size="15">Temperaturen der du bruker rommet.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V5h18v16M2 21h20M7 9h10v7H7V9Zm5 0v7"/></g></g></svg>