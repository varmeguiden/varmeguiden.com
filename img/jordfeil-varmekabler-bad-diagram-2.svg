<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Fra lokalisering til ferdig bad</title><desc>Prinsipp for en vurdert punktreparasjon. Bekreft feilen: Elektrikeren avgrenser del og mulig sted.. Vurder oppbygningen: Avklar kabelens plassering og våtrommets lag.. Avtal tilbakeføring: Dokumenter hvem som ivaretar gulv og kontroll..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Fra lokalisering til ferdig bad</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Bekreft feilen</text><text x="43" y="99" font-size="15">Elektrikeren avgrenser del og mulig sted.</text><g transform="translate(501,72)" fill="none" stroke="#176346" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l4 2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Vurder oppbygningen</text><text x="43" y="165" font-size="15">Avklar kabelens plassering og våtrommets lag.</text><g transform="translate(501,138)" fill="none" stroke="#a75b24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3V6Zm5 0v5m4-5v3m4-3v5"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Avtal tilbakeføring</text><text x="43" y="231" font-size="15">Dokumenter hvem som ivaretar gulv og kontroll.</text><g transform="translate(501,204)" fill="none" stroke="#285477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10M4 5h10m6 8v7H4V5"/></g></g></svg>