<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>56,7 kWh over sju døgn</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">56,7 kWh over sju døgn</text><rect x="18" y="52" width="524" height="69" rx="9" fill="#dcece0"/><circle cx="43" cy="73" r="12" fill="#24674b"/><text x="39" y="78" font-size="14" fill="#fff">1</text><text x="63" y="78" font-weight="700">Avlesning mandag</text><text x="63" y="103" font-size="16">1 202,4 kWh på telleren.</text><rect x="18" y="130" width="524" height="69" rx="9" fill="#fff"/><circle cx="43" cy="151" r="12" fill="#24674b"/><text x="39" y="156" font-size="14" fill="#fff">2</text><text x="63" y="156" font-weight="700">Neste mandag</text><text x="63" y="181" font-size="16">1 259,1 kWh på samme teller.</text><rect x="18" y="208" width="524" height="69" rx="9" fill="#fae9d3"/><circle cx="43" cy="229" r="12" fill="#24674b"/><text x="39" y="234" font-size="14" fill="#fff">3</text><text x="63" y="234" font-weight="700">Differanse</text><text x="63" y="259" font-size="16">56,7 kWh, i snitt 8,1 kWh per døgn.</text></g></svg>