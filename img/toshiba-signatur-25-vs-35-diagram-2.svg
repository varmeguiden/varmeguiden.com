<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Effekt som må dekkes ved −20 °C</title><desc>Eksempel med et anslått sonebehov på 4,5 kW. Med Signatur 25: 1,3 kW gjenstår. Med Signatur 35: 1,2 kW gjenstår.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Effekt som må dekkes ved −20 °C</text><text x="25" y="82">Med Signatur 25</text><rect x="25" y="94" width="450.0" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">1,3 kW gjenstår</text><text x="25" y="178">Med Signatur 35</text><rect x="25" y="190" width="415.38" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">1,2 kW gjenstår</text></g></svg>