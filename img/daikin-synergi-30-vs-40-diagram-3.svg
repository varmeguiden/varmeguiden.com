<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Sjekk innholdet, så prisforskjellen</title><desc>Se etter tydelige poster i begge tilbudene. Modell: Sammenlign hele koden på inne- og utedel.. Montering: Hold rørvei, stativ og tilvalg like.. Støy: Avklar plassering og drift også på kalde dager..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Sjekk innholdet, så prisforskjellen</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Modell</text><text x="43" y="99" font-size="15">Sammenlign hele koden på inne- og utedel.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10l8 7-8 7H3V5Zm4 7h1"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Montering</text><text x="43" y="165" font-size="15">Hold rørvei, stativ og tilvalg like.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8-8a5 5 0 0 1 6-7l-3 3 2 2 3-3a5 5 0 0 1-7 6l-8 8-1-1Z"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Støy</text><text x="43" y="231" font-size="15">Avklar plassering og drift også på kalde dager.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h4l5-4v12l-5-4H3v-4Zm13-1c2 2 2 4 0 6m3-9c4 4 4 8 0 12"/></g></g></svg>