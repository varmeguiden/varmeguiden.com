<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Data ved et aktuatorbytte</title><desc>Fagpersonen må avklare både mekanikk og styring. Merking: Ta med modell, spenning og NC eller NO.. Ventil: Få bekreftet tilkobling og arbeidsvei.. Styring: Dokumenter kontrollenhet og den aktuelle sonen..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Data ved et aktuatorbytte</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Merking</text><text x="43" y="99" font-size="15">Ta med modell, spenning og NC eller NO.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10l8 7-8 7H3V5Zm4 7h1"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Ventil</text><text x="43" y="165" font-size="15">Få bekreftet tilkobling og arbeidsvei.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9 3-9 3V9Zm18 0-9 3 9 3V9Zm-9-3v6m-4-6h8"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Styring</text><text x="43" y="231" font-size="15">Dokumenter kontrollenhet og den aktuelle sonen.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm4 4h5v5H7V9Zm8 1h3m-3 4h3"/></g></g></svg>