<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Fra rommet til vannet</title><desc>Ett varmekall må gjennom flere ledd. Termostat: Registrerer behov for varme i rommet.. Styring og aktuator: Styringen gir signal til riktig utgang.. Ventil og sløyfe: Ventilens posisjon påvirker vannets vei..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Fra rommet til vannet</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Termostat</text><text x="43" y="99" font-size="15">Registrerer behov for varme i rommet.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1 4h6v4H9Zm0 8h6m-3 3v2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Styring og aktuator</text><text x="43" y="165" font-size="15">Styringen gir signal til riktig utgang.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm4 4h5v5H7V9Zm8 1h3m-3 4h3"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Ventil og sløyfe</text><text x="43" y="231" font-size="15">Ventilens posisjon påvirker vannets vei.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9 3-9 3V9Zm18 0-9 3 9 3V9Zm-9-3v6m-4-6h8"/></g></g></svg>