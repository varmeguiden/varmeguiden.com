<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Ta valget i denne rekkefølgen</title><desc>Bruk den sonen varmepumpa faktisk skal varme. Klimapunkt: Velg en relevant utetemperatur for boligen.. Varmebehov: Sammenlign behov og oppgitt effekt der.. Tilbud: Pris og plassering skal gjelde samme montasje..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Ta valget i denne rekkefølgen</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Klimapunkt</text><text x="43" y="99" font-size="15">Velg en relevant utetemperatur for boligen.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4 7l16 10M4 17 20 7m-8-4-2 2m2-2 2 2m-2 16-2-2m2 2 2-2"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Varmebehov</text><text x="43" y="165" font-size="15">Sammenlign behov og oppgitt effekt der.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 14h6l-1 8 9-12h-6l1-8Z"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Tilbud</text><text x="43" y="231" font-size="15">Pris og plassering skal gjelde samme montasje.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 4v14H6V3Zm9 0v5h3M9 12h6m-6 4h6"/></g></g></svg>