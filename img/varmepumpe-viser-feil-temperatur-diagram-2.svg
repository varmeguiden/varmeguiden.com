<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Sammenlign målepunktene</title><desc>Vent til målerne har stabilisert seg. Høyt ved innedelen: Lufta kan være varmere høyere i rommet.. Ved sitteplassen: Velg fri luft uten sol eller direkte luftstrøm.. Samme tidspunkt: Noter begge verdiene med samme driftsmodus..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Sammenlign målepunktene</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Høyt ved innedelen</text><text x="43" y="99" font-size="15">Lufta kan være varmere høyere i rommet.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm6 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 0v8m-4-4h8m3-4h3m-3 4h3m-3 4h3"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Ved sitteplassen</text><text x="43" y="165" font-size="15">Velg fri luft uten sol eller direkte luftstrøm.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V5h18v16M2 21h20M7 9h10v7H7V9Zm5 0v7"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Samme tidspunkt</text><text x="43" y="231" font-size="15">Noter begge verdiene med samme driftsmodus.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l4 2"/></g></g></svg>