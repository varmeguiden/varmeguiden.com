<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>Én tank kan knytte sammen to kretser</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">Én tank kan knytte sammen to kretser</text><rect x="20" y="113" width="135" height="91" rx="10" fill="#dcece0"/><rect x="210" y="76" width="140" height="160" rx="22" fill="#f6d8a9"/><rect x="404" y="113" width="135" height="91" rx="10" fill="#fff"/><path d="M155 133h55m140 0h54M155 185h55m140 0h54" stroke="#286848" stroke-width="4"/><text x="32" y="163">Varmepumpe</text><text x="256" y="164">Tank</text><text x="416" y="163">Varmekrets</text><text x="20" y="278">Prinsipp med to kretser, ikke en montasjetegning.</text></g></svg>