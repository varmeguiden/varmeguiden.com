<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Gjennom veggen eller gulvet?</title><desc>Begge ruter krever modellens anvisning. Vegg: Se ute hvor åpningen kan havne.. Gulv: Avklar etasjeskille, adkomst og eventuell kald sone.. Begge: Vurder lengde, bend og dokumentert tetting..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Gjennom veggen eller gulvet?</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Vegg</text><text x="43" y="99" font-size="15">Se ute hvor åpningen kan havne.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3V5Zm0 7h18m-12-7v7m6 0v7"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Gulv</text><text x="43" y="165" font-size="15">Avklar etasjeskille, adkomst og eventuell kald sone.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h7v-6h6V8h5M3 5h7m-3-3 3 3-3 3"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Begge</text><text x="43" y="231" font-size="15">Vurder lengde, bend og dokumentert tetting.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10a5 5 0 0 1 5 5v8m4 0v-8a9 9 0 0 0-9-9H3m0 0v4m15 13h4"/></g></g></svg>