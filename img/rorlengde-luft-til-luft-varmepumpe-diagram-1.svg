<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Fire tall før plasseringen låses</title><desc>Les modellens manual og montørens tilbud sammen. 1–2. Minste og største lengde: Begge gjelder for den valgte kombinasjonen.. 3. Høydeforskjell: Mål forskjellen mellom enhetenes plassering.. 4. Meter inkludert: Tall i tilbudet kan avvike fra modellgrensen..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Fire tall før plasseringen låses</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">1–2. Minste og største lengde</text><text x="43" y="99" font-size="15">Begge gjelder for den valgte kombinasjonen.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v8H3V8Zm4 0v4m4-4v3m4-3v4m4-4v3"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">3. Høydeforskjell</text><text x="43" y="165" font-size="15">Mål forskjellen mellom enhetenes plassering.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M9 6l3-3 3 3m-6 12 3 3 3-3M3 3h3m-3 18h3"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">4. Meter inkludert</text><text x="43" y="231" font-size="15">Tall i tilbudet kan avvike fra modellgrensen.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 4v14H6V3Zm9 0v5h3M9 12h6m-6 4h6"/></g></g></svg>