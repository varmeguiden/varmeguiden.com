<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Oppgitt kapasitet ved −15 °C</title><desc>Begge tallene gjelder A-variantene ved samme kuldepunkt. Synergi 30: 4,8 kW. Synergi 40: 5,4 kW.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Oppgitt kapasitet ved −15 °C</text><text x="25" y="82">Synergi 30</text><rect x="25" y="94" width="400.0" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">4,8 kW</text><text x="25" y="178">Synergi 40</text><rect x="25" y="190" width="450.0" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">5,4 kW</text></g></svg>