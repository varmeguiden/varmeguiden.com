<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Finn grensen mellom varm og kald sone</title><desc>Prinsipp for en bolig med kald kjeller. Oppholdsrom: Mål hvor du kjenner et kaldt gulv.. Etasjeskille: Undersøk gulvfelt, ytterkant og gjennomføringer.. Kjeller: Følg temperatur og fukt før du velger tiltak..</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Finn grensen mellom varm og kald sone</text><rect x="24" y="57" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="57" width="7" height="55" rx="3" fill="#176346"/><text x="43" y="78" font-weight="700">Oppholdsrom</text><text x="43" y="99" font-size="15">Mål hvor du kjenner et kaldt gulv.</text><g transform="translate(499,72)" fill="none" stroke="#176346" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V5h18v16M2 21h20M7 9h10v7H7V9Zm5 0v7"/></g><rect x="24" y="123" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="123" width="7" height="55" rx="3" fill="#a75b24"/><text x="43" y="144" font-weight="700">Etasjeskille</text><text x="43" y="165" font-size="15">Undersøk gulvfelt, ytterkant og gjennomføringer.</text><g transform="translate(499,138)" fill="none" stroke="#a75b24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h7v-6h6V8h5M3 5h7m-3-3 3 3-3 3"/></g><rect x="24" y="189" width="512" height="55" rx="8" fill="#fff"/><rect x="24" y="189" width="7" height="55" rx="3" fill="#285477"/><text x="43" y="210" font-weight="700">Kjeller</text><text x="43" y="231" font-size="15">Følg temperatur og fukt før du velger tiltak.</text><g transform="translate(499,204)" fill="none" stroke="#285477" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V6a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0Zm2 3v-8m5-2h3m-3 4h2"/></g></g></svg>