<svg xmlns="http://www.w3.org/2000/svg" width="560" height="298" viewBox="0 0 560 298"><title>To veier fra luft til vann</title><rect width="560" height="298" rx="12" fill="#eef5ee"/><g font-family="system-ui,sans-serif" font-size="17" fill="#193c2c"><text x="20" y="34" font-weight="700" font-size="22">To veier fra luft til vann</text><text x="140" y="76">Ute</text><text x="360" y="76">Inne</text><path d="M280 60v207" stroke="#526459" stroke-width="3" stroke-dasharray="5 6"/><rect x="25" y="94" width="235" height="70" rx="9" fill="#dcece0"/><rect x="300" y="94" width="235" height="70" rx="9" fill="#fff"/><rect x="25" y="182" width="235" height="70" rx="9" fill="#dcece0"/><rect x="300" y="182" width="235" height="70" rx="9" fill="#fff"/><text x="40" y="120" font-weight="700">Monoblokk</text><text x="40" y="145">Varmeveksling mot væske</text><text x="314" y="128">← Væskerør gjennom vegg →</text><text x="40" y="207" font-weight="700">Splitt</text><text x="40" y="232">Kuldemedierør til innedel</text><text x="315" y="215">Varmeveksling mot vann</text><text x="25" y="281">Prinsipp. Be om tegningen til modellen i tilbudet.</text></g></svg>