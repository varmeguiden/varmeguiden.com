<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Fem meter sammenlignet med sju</title><desc>Illustrasjon av lengder. Beregn tillegg etter tilbudet. Lengde inkludert i tilbudet: 5 meter. Oppmålt rørvei: 7 meter.</desc><rect width="560" height="260" rx="12" fill="#edf5ee"/><g font-family="system-ui,sans-serif" font-size="16" fill="#193e2c"><text x="24" y="36" font-size="22" font-weight="700">Fem meter sammenlignet med sju</text><text x="25" y="82">Lengde inkludert i tilbudet</text><rect x="25" y="94" width="321.43" height="26" rx="5" fill="#176346"/><text x="28" y="144" font-weight="700">5 meter</text><text x="25" y="178">Oppmålt rørvei</text><rect x="25" y="190" width="450.0" height="26" rx="5" fill="#a75b24"/><text x="28" y="240" font-weight="700">7 meter</text></g></svg>